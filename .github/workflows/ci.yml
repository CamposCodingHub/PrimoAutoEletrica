name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Format check
        run: dotnet format --verify-no-changes --verbosity diagnostic

  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Build solution
        run: dotnet build PrimoAutoEletrica.sln --configuration Release --no-restore --verbosity normal

      - name: Run unit tests
        run: dotnet test PrimoAutoEletrica.sln --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --logger trx --filter "FullyQualifiedName!~UITests"

      - name: Generate code coverage report
        if: always()
        run: |
          $coverageFiles = Get-ChildItem -Path . -Filter "coverage.cobertura.xml" -Recurse
          if ($coverageFiles.Count -gt 0) {
            Write-Host "✅ Arquivos de cobertura encontrados: $($coverageFiles.Count)"
          } else {
            Write-Host "⚠️ Nenhum arquivo de cobertura encontrado"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: '**/TestResults/**/*.trx'

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ github.run_number }}
          path: '**/TestResults/**/coverage.cobertura.xml'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: |
            **/TestResults/**

      - name: Generate version
        id: version
        run: |
          $version = "{0:yyyy.MM.dd}.{1}" -f (Get-Date), ($env:GITHUB_RUN_NUMBER)
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Generated version: $version"

      - name: Publish WPF application
        run: dotnet publish PrimoAutoEletrica/PrimoAutoEletrica.csproj --configuration Release --output ./publish-wpf --self-contained false -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Publish API application
        run: dotnet publish PrimoAutoEletrica.Api/PrimoAutoEletrica.Api.csproj --configuration Release --output ./publish-api --self-contained false -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Create WPF ZIP archive
        run: Compress-Archive -Path ./publish-wpf/* -DestinationPath ./PrimoAutoEletrica-WPF-${{ steps.version.outputs.VERSION }}.zip

      - name: Create API ZIP archive
        run: Compress-Archive -Path ./publish-api/* -DestinationPath ./PrimoAutoEletrica-API-${{ steps.version.outputs.VERSION }}.zip

      - name: Upload WPF artifact
        uses: actions/upload-artifact@v4
        with:
          name: primoautoeletrica-wpf-${{ steps.version.outputs.VERSION }}
          path: ./PrimoAutoEletrica-WPF-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: primoautoeletrica-api-${{ steps.version.outputs.VERSION }}
          path: ./PrimoAutoEletrica-API-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "🔨 Build Summary - Run #${{ github.run_number }}"
          Write-Host "═══════════════════════════════════════════════════════════"
          Write-Host "✅ Status: ${{ job.status }}"
          Write-Host "📦 Version: ${{ steps.version.outputs.VERSION }}"
          Write-Host "🔗 Branch: ${{ github.ref }}"
          Write-Host "👤 Triggered by: ${{ github.actor }}"
          Write-Host "═══════════════════════════════════════════════════════════"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'csharp'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Build for analysis
        run: dotnet build PrimoAutoEletrica.sln --configuration Release --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: '/language:csharp'

  test-coverage:
    name: Test Coverage Report
    runs-on: windows-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: code-coverage-${{ github.run_number }}

      - name: Report coverage metrics
        run: |
          Write-Host "📊 Test Coverage Metrics"
          Write-Host "════════════════════════════════════════"
          $coverageFiles = Get-ChildItem -Filter "coverage.cobertura.xml" -Recurse
          if ($coverageFiles.Count -gt 0) {
            foreach ($file in $coverageFiles) {
              Write-Host "📁 $($file.FullName)"
            }
          } else {
            Write-Host "⚠️ Nenhum arquivo de cobertura encontrado"
          }
