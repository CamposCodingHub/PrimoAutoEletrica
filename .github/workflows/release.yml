name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (ex: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Alinhado ao TFM do produto: net6.0-windows (não publicar Release automaticamente nesta fase)
          dotnet-version: 6.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Get version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Release version: $version"

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Build solution
        run: dotnet build PrimoAutoEletrica.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Run tests
        run: dotnet test PrimoAutoEletrica.sln --no-restore --verbosity normal

      - name: Publish WPF (self-contained win-x64, sem SingleFile/Trim)
        run: |
          dotnet publish PrimoAutoEletrica/PrimoAutoEletrica.csproj `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            --output ./artifacts/publish/win-x64 `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false

      - name: Validate EXE version metadata
        run: |
          $exe = Resolve-Path ./artifacts/publish/win-x64/PrimoAutoEletrica.exe
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "ProductVersion=$($info.ProductVersion) FileVersion=$($info.FileVersion)"
          if ($info.ProductVersion -eq "0.0.0.0") { throw "VERSIONING ISSUE: ProductVersion 0.0.0.0" }

      - name: Create WPF ZIP archive (auxiliar; instalador Inno é o canal oficial)
        run: Compress-Archive -Path ./artifacts/publish/win-x64/* -DestinationPath ./PRIMOX-Workshop-win-x64-${{ steps.version.outputs.VERSION }}.zip

      - name: Upload publish artifact (sem criar GitHub Release automático)
        uses: actions/upload-artifact@v4
        with:
          name: primox-workshop-win-x64-${{ steps.version.outputs.VERSION }}
          path: |
            ./artifacts/publish/win-x64
            ./PRIMOX-Workshop-win-x64-${{ steps.version.outputs.VERSION }}.zip

      - name: Notify
        run: |
          Write-Host "Publish PRIMOX Workshop v${{ steps.version.outputs.VERSION }} validado."
          Write-Host "Instalador Inno oficial: Scripts/Build-PrimoXCommercialRelease.ps1 (local/CI com ISCC)."
          Write-Host "GitHub Release automatico: DESABILITADO nesta fase."