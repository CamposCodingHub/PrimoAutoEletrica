name: Performance & Security Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 3 * * *'  # Run nightly at 3 AM
  workflow_dispatch:

jobs:
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: List outdated packages
        run: dotnet outdated PrimoAutoEletrica.sln || echo "Note: dotnet-outdated may not be installed"

      - name: Check for vulnerable dependencies
        run: |
          echo "🔍 Checking for vulnerable NuGet packages..."
          dotnet list package --vulnerable PrimoAutoEletrica.sln || true

  security-best-practices:
    name: Security Best Practices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Audit for security issues
        run: |
          echo "🔐 Running security audit..."
          dotnet build PrimoAutoEletrica.sln /p:EnableNETAnalyzers=true /p:AnalysisLevel=9.0

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json

  performance-analysis:
    name: Performance Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Build for performance analysis
        run: |
          Write-Host "⏱️ Building solution in Release mode..."
          dotnet build PrimoAutoEletrica.sln --configuration Release --no-restore -v:minimal

      - name: Run performance benchmarks
        run: |
          Write-Host "📊 Running performance benchmarks..."
          # This can be expanded to run actual benchmark projects
          # dotnet run --project PrimoAutoEletrica.Benchmarks --configuration Release

      - name: Analyze assembly sizes
        run: |
          Write-Host "📦 Analyzing assembly sizes..."
          $assemblies = Get-ChildItem -Path ".\bin\Release" -Filter "*.dll" -Recurse
          $assemblies | Sort-Object -Property Length -Descending | Select-Object -First 10 | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            Write-Host "$($_.Name): $size MB"
          }

      - name: Check build duration
        run: |
          Write-Host "⏱️ Build time analysis complete"
          Write-Host "For detailed performance metrics, enable MSBuild logging"

  code-complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install complexity analyzer
        run: dotnet tool install -g dotnet-cc || dotnet tool update -g dotnet-cc

      - name: Analyze cyclomatic complexity
        run: |
          echo "🔍 Analyzing cyclomatic complexity..."
          cd PrimoAutoEletrica
          dotnet-cc . -d -p false || echo "Note: Tool execution completed with informational output"
          cd ..

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore PrimoAutoEletrica.sln

      - name: Generate license report
        run: |
          echo "📋 Generating license compliance report..."
          echo "Dependencies and their licenses:" > license-report.txt
          dotnet list package PrimoAutoEletrica.sln >> license-report.txt 2>&1 || true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.txt

  analysis-summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [dependency-check, security-best-practices, performance-analysis, code-complexity, license-compliance]
    if: always()
    steps:
      - name: Generate analysis report
        run: |
          echo "# Security & Performance Analysis Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Dependency Vulnerability Scan: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Security Best Practices: ${{ needs.security-best-practices.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Performance Analysis: ${{ needs.performance-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Code Complexity: ${{ needs.code-complexity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 License Compliance: ${{ needs.license-compliance.result }}" >> $GITHUB_STEP_SUMMARY
